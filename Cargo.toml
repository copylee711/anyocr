[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/copylee711/anyocr"

[workspace.dependencies]
anyocr-core = { path = "crates/anyocr-core" }
anyocr-engines = { path = "crates/anyocr-engines" }
anyocr-pdf = { path = "crates/anyocr-pdf" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "tiff", "gif"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
oar-ocr = { version = "0.11", features = ["auto-download"] }
pdfium-render = "0.9"
lopdf = { version = "0.47", default-features = false, features = ["rayon"] }
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 推理与图像处理在 debug 下也需要优化，否则开发时慢到无法使用
[profile.dev.package."*"]
opt-level = 3
