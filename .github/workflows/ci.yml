name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec prettier --check .

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 下载 PDFium
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p anyocr-core -p anyocr-engines -p anyocr-pdf -p anyocr-output -p anyocr-qrcode -p anyocr-cli -p anyocr-desktop --all-targets -- -D warnings
      - run: cargo test -p anyocr-core -p anyocr-engines -p anyocr-pdf -p anyocr-output -p anyocr-qrcode -p anyocr-cli -p anyocr-desktop

  build:
    runs-on: windows-latest
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 下载 PDFium
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1
      - run: pnpm install --frozen-lockfile
      # CI 没有更新签名私钥，不生成更新包（正式发布见 release.yml）
      - run: pnpm tauri build --config src-tauri/tauri.nosign.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: anyocr-windows
          path: target/release/bundle/nsis/*.exe
